[project]
name = "ctfindings"
version = "1.0.0"
description = "Chest CT report finding classification: encoders, generative LLMs and typed decisions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
api = [
    "openai==3.26.1",
    "typesafe-sdk==0.7.2",
]
train = [
    "torch==2.14.1",
    "transformers==5.19.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[project.scripts]
ctfindings = "ctfindings.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctfindings"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]
